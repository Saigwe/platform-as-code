apiVersion: batch/v1
kind: CronJob
metadata:
  name: dbt-build
spec:
  schedule: "15 * * * *"             # prod builds hourly
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: dbt
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
