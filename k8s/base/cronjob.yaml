apiVersion: batch/v1
kind: CronJob
metadata:
  name: dbt-build
  labels:
    app.kubernetes.io/name: dbt-runner
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid          # never let two dbt runs fight over the same tables
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 2700    # a stuck run is killed before the next one is due
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dbt-runner
        spec:
          serviceAccountName: dbt-runner
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: dbt
              image: ghcr.io/saigwe/dbt-runner:0.1.0
              args: ["build"]                 # target comes from DBT_TARGET in the ConfigMap
              envFrom:
                - configMapRef:
                    name: dbt-runner-config
                - secretRef:
                    name: snowflake-credentials   # synced from the cloud secret manager, never committed
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scratch
                  mountPath: /tmp
          volumes:
            - name: scratch
              emptyDir: {}
